[Service]
# DATA_DIRECTORY is load-bearing. The node's --data-directory help reads "If
# omitted will store in memory": the shared EC2 unit mounts @DATA@/aztec but
# never points the node at it, so the volume stayed empty and EVERY restart
# silently re-bootstrapped a fresh L2 chain, losing all deployed L2 contracts.
# A reboot would have done the same.
#
# NOT set here: SEQ_MIN_TX_PER_BLOCK / SEQ_BUILD_CHECKPOINT_IF_EMPTY. Both
# resolve correctly in the sequencer config and both are no-ops, because
# `start --local-network` runs an AutomineSequencer rather than the slot-based
# one they configure. Blocks in this mode are strictly tx-driven; slot-cadence
# production would mean leaving --local-network entirely.
ExecStart=
ExecStart=/usr/bin/docker run --rm --name aztec-sandbox --network host \
  -e ETHEREUM_HOSTS=http://127.0.0.1:8545 -e L1_CHAIN_ID=31337 \
  -e DATA_DIRECTORY=/var/lib/aztec \
  -v @DATA@/aztec:/var/lib/aztec \
  aztecprotocol/aztec:@AZTEC_TAG@ start --local-network

MemoryHigh=4G
MemoryMax=5G
