[Service]
# DATA_DIRECTORY: the node's --data-directory help reads "If omitted will store
# in memory", and the shared EC2 unit mounts @DATA@/aztec without ever pointing
# the node at it. Setting it does make the node WRITE there (the volume fills).
#
# It does NOT make L2 state survive a restart. Verified 2026-09-22: with this
# set and /data/aztec at 15 MB, `systemctl restart aztec-sandbox` still took the
# chain from height 38 back to genesis (height 4) and every deployed L2 contract
# was gone. `start --local-network` is a BOOTSTRAP mode — it re-bootstraps a
# fresh chain on every start regardless of the data directory.
#
# So: an Aztec restart or a reboot still destroys the L2 chain. Recovery is
# deploy-pi.sh's first-run path (~30 min). Real persistence would mean running
# the node in a resuming mode rather than --local-network, with the L1 rollup
# contracts deployed once and the node syncing from L1 — a separate change.
#
# An earlier version of this comment claimed the flag fixed the restart-wipe.
# It does not; that claim was made from the volume growing, without testing a
# restart.
ExecStart=
ExecStart=/usr/bin/docker run --rm --name aztec-sandbox --network host \
  -e ETHEREUM_HOSTS=http://127.0.0.1:8545 -e L1_CHAIN_ID=31337 \
  -e DATA_DIRECTORY=/var/lib/aztec \
  -v @DATA@/aztec:/var/lib/aztec \
  aztecprotocol/aztec:@AZTEC_TAG@ start --local-network

MemoryHigh=4G
MemoryMax=5G
