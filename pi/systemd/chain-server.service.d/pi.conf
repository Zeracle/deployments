[Service]
# Run as the admin user, not root. The shared EC2 units set no User=, so systemd
# runs them as root — but deploys run as admin, and every artefact these services
# create (the embedded wallet's LMDB store in particular) then lands root-owned.
# `yarn clean:pxe` during a redeploy dies on "Permission denied" and the L2 deploy
# fails. Aligning the service user with the deploy user removes the class.
User=admin
Group=admin
Environment=HOST=0.0.0.0
# The base (EC2) unit hard-codes ExecStart=/usr/bin/npm; on the Pi npm comes
# from nvm and is symlinked into /usr/local/bin by provision-pi.sh. Override the
# path (spec Decision 4: drop-ins override paths).
ExecStart=
ExecStart=/usr/local/bin/npm start
MemoryHigh=768M
MemoryMax=1G
