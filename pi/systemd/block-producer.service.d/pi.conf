[Service]
# Run as the admin user, not root. The shared EC2 units set no User=, so systemd
# runs them as root — but deploys run as admin, and every artefact these services
# create (the embedded wallet's LMDB store in particular) then lands root-owned.
# `yarn clean:pxe` during a redeploy dies on "Permission denied" and the L2 deploy
# fails. Aligning the service user with the deploy user removes the class.
# (Since ZER-81 the trigger no longer touches the shared v1-l2/aztec-wallet-data
# store: it runs an ephemeral wallet in a private TMPDIR that it removes itself.
# User=admin still keeps anything it does create admin-owned.)
User=admin
Group=admin
# The shared EC2 unit hard-codes --loop 60, so every L2 transaction waits up to a
# minute for the next trigger. Decision 4 sanctions drop-in arg overrides;
# @BLOCK_INTERVAL@ is substituted by provision-pi.sh from pi.env.
ExecStart=
ExecStart=/usr/bin/bash @REPO@/v1-l2/scripts/sandbox-block-producer.sh --loop @BLOCK_INTERVAL@

# Measured: one trigger peaks at ~954 MB RSS (it stands up an embedded PXE and
# wallet and deploys a throwaway account). An earlier 512M cap here made every
# trigger die with "Reached heap limit - JavaScript heap out of memory", so no
# blocks were produced at all and the failure was mistaken for slowness.
#
# Trigger time (ZER-81): ~15-18 s per block, flat. It used to grow ~0.18 s per
# block (150 s at block 817) because every trigger left a throwaway account in
# the shared wallet store; if it climbs again, look for a script persisting
# per-run accounts there.
MemoryHigh=1536M
MemoryMax=2G
