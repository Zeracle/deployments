[Service]
# The shared EC2 unit hard-codes --loop 60, so every L2 transaction waits up to a
# minute for the next trigger. Decision 4 sanctions drop-in path/arg overrides;
# @BLOCK_INTERVAL@ is substituted by provision-pi.sh from pi.env.
ExecStart=
ExecStart=/usr/bin/bash @REPO@/v1-l2/scripts/sandbox-block-producer.sh --loop @BLOCK_INTERVAL@
MemoryHigh=384M
MemoryMax=512M
